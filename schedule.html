    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #faf8f3;
            color: #344d37;
        }

        /* PAGE HEADER */

        header {
            background: linear-gradient(135deg, #fff3df, #f5e5cf);
            text-align: center;
            padding: 80px 20px 65px;
        }

        .eyebrow {
            color: #a85127;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        header h1 {
            color: #a85127;
            font-size: clamp(34px, 5vw, 52px);
            margin: 0 0 25px;
        }

        .subtitle {
            font-size: 16px;
            font-style: italic;
            color: #344d37;
        }

        /* SCHEDULE IMAGE */

        .schedule-content {
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 20px 90px;
            text-align: center;
        }

        .schedule-image {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 5px 24px rgba(0, 0, 0, 0.07);
        }

        /* DESKTOP NAVIGATION */

        .site-nav {
            background: #fffaf2;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px #0001;
            padding: 16px;
        }

        .nav-links {
            display: flex;
            gap: 18px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #36513c;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #a85127;
            text-decoration: underline;
        }

        .menu-toggle,
        .menu-button {
            display: none;
        }

        /* MOBILE NAVIGATION */

        @media (max-width: 749px) {

            .site-nav {
                padding: 0;
            }

            .menu-button {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 18px 22px;
                color: #36513c;
                font-weight: 700;
                cursor: pointer;
            }

            .hamburger {
                font-size: 26px;
            }

            .nav-links {
                display: none;
                flex-direction: column;
                align-items: stretch;
                gap: 0;
                border-top: 1px solid #e8dccb;
            }

            .menu-toggle:checked ~ .nav-links {
                display: flex;
            }

            .nav-links a {
                padding: 16px 22px;
                border-bottom: 1px solid #eee4d6;
                font-size: 15px;
            }

            header {
                padding: 55px 20px;
            }

            .schedule-content {
                padding: 30px 12px 60px;
            }

        }

.closing {

}

footer {
